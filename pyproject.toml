[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
[project]
name = "pulse-workers"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "numpy>=2,<3", "faster-whisper==1.2.1", "piper-tts>=1.3,<2", "transformers==5.20.2", "torch>=2.6,<3", "soundfile>=0.13,<1", "scipy>=1.15,<2", "httpx>=0.28,<1", "websockets>=15,<17"]
[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff==0.17.1", "playwright>=1.50,<2"]
[tool.setuptools]
packages = ["worker"]
[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
[tool.ruff.lint.per-file-ignores]
"scripts/render_readme.py" = ["E501"] # Embedded Markdown tables and prose.
